<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - BIG Analytica</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0b1320 0%, #1a2332 100%);
      color: #fff;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      border-radius: 15px;
      border: 1px solid rgba(249, 178, 51, 0.3);
    }

    .header h1 {
      color: #f9b233;
      font-size: 2.5rem;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .user-info span {
      color: #cbd5e0;
    }

    .logout-btn {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(220, 38, 38, 0.4);
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 15px;
    }

    .nav-tab {
      padding: 15px 25px;
      background: transparent;
      border: none;
      color: #cbd5e0;
      cursor: pointer;
      border-radius: 10px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .nav-tab.active {
      background: linear-gradient(135deg, #f9b233, #ff6b35);
      color: #0b1320;
    }

    .nav-tab:hover:not(.active) {
      background: rgba(249, 178, 51, 0.2);
      color: #f9b233;
    }

    .content-section {
      display: none;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .content-section.active {
      display: block;
    }

    .form-group {
      margin-bottom: 25px;
    }

    .form-group label {
      display: block;
      color: #f9b233;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 15px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #f9b233;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 20px rgba(249, 178, 51, 0.3);
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .btn {
      padding: 15px 30px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      font-size: 1rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f9b233, #ff6b35);
      color: #fff;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(249, 178, 51, 0.4);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #6b7280, #4b5563);
      color: #fff;
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(107, 114, 128, 0.4);
    }

    .btn-danger {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: #fff;
    }

    .btn-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(220, 38, 38, 0.4);
    }

    .btn-success {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
    }

    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(34, 197, 94, 0.4);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-actions {
      display: flex;
      gap: 15px;
      justify-content: flex-end;
      margin-top: 30px;
    }

    .message {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .message.success {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .message.error {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .message.info {
      background: rgba(59, 130, 246, 0.2);
      color: #3b82f6;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #cbd5e0;
    }

    .content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .content-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .content-card h3 {
      color: #f9b233;
      margin-bottom: 15px;
    }

    .content-card p {
      color: #cbd5e0;
      margin-bottom: 15px;
    }

    .content-card .actions {
      display: flex;
      gap: 10px;
    }

    .image-preview {
      max-width: 200px;
      max-height: 150px;
      border-radius: 10px;
      margin-top: 10px;
      border: 2px solid rgba(249, 178, 51, 0.3);
    }

    .file-input-wrapper {
      position: relative;
      display: inline-block;
      cursor: pointer;
      width: 100%;
    }

    .file-input-wrapper input[type=file] {
      position: absolute;
      left: -9999px;
    }

    .file-input-label {
      display: block;
      padding: 15px;
      border: 2px dashed rgba(249, 178, 51, 0.3);
      border-radius: 10px;
      text-align: center;
      color: #f9b233;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .file-input-label:hover {
      border-color: #f9b233;
      background: rgba(249, 178, 51, 0.1);
    }

    @media (max-width: 768px) {
      .container {
        padding: 10px;
      }

      .header {
        flex-direction: column;
        gap: 20px;
        text-align: center;
      }

      .nav-tabs {
        flex-wrap: wrap;
        justify-content: center;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .form-actions {
        flex-direction: column;
      }

      .content-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>Admin Dashboard</h1>
      <div class="user-info">
        <span id="userInfo">Welcome, Admin</span>
        <button class="logout-btn" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="showSection('homepage')">Homepage</button>
      <button class="nav-tab" onclick="showSection('strategic-areas')">Strategic Areas</button>
      <button class="nav-tab" onclick="showSection('strategy-development')">Strategy Development</button>
      <button class="nav-tab" onclick="showSection('partnerships')">Partnerships</button>
      <button class="nav-tab" onclick="showSection('site-settings')">Site Settings</button>
      <button class="nav-tab" onclick="showSection('users')">User Management</button>
    </div>

    <!-- Message Container -->
    <div id="messageContainer"></div>

    <!-- Homepage Content Section -->
    <div id="homepage" class="content-section active">
      <h2>Homepage Content</h2>
      <form id="homepageForm">
        <div class="form-row">
          <div class="form-group">
            <label for="heroHeadline">Hero Headline</label>
            <input type="text" id="heroHeadline" name="heroHeadline" placeholder="Enter hero headline">
          </div>
          <div class="form-group">
            <label for="heroSubheadline">Hero Subheadline</label>
            <input type="text" id="heroSubheadline" name="heroSubheadline" placeholder="Enter hero subheadline">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="heroBg1">Hero Background Image 1</label>
            <div class="file-input-wrapper">
              <input type="file" id="heroBg1" name="heroBg1" accept="image/*" onchange="previewImage(this, 'heroBg1Preview')">
              <label for="heroBg1" class="file-input-label">
                <i class="fas fa-upload"></i> Choose Image
              </label>
            </div>
            <img id="heroBg1Preview" class="image-preview" style="display: none;">
          </div>
          <div class="form-group">
            <label for="heroBg2">Hero Background Image 2</label>
            <div class="file-input-wrapper">
              <input type="file" id="heroBg2" name="heroBg2" accept="image/*" onchange="previewImage(this, 'heroBg2Preview')">
              <label for="heroBg2" class="file-input-label">
                <i class="fas fa-upload"></i> Choose Image
              </label>
            </div>
            <img id="heroBg2Preview" class="image-preview" style="display: none;">
          </div>
        </div>

        <div class="form-group">
          <label for="platformTitle">Platform Section Title</label>
          <input type="text" id="platformTitle" name="platformTitle" placeholder="Enter platform section title">
        </div>

        <div class="form-group">
          <label for="strategyTitle">Strategy Section Title</label>
          <input type="text" id="strategyTitle" name="strategyTitle" placeholder="Enter strategy section title">
        </div>

        <div class="form-group">
          <label for="partnershipsTitle">Partnerships Section Title</label>
          <input type="text" id="partnershipsTitle" name="partnershipsTitle" placeholder="Enter partnerships section title">
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="resetForm('homepageForm')">Reset</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>

    <!-- Strategic Areas Section -->
    <div id="strategic-areas" class="content-section">
      <h2>Strategic Areas Management</h2>
      <div class="content-grid" id="strategicAreasGrid">
        <div class="loading">Loading strategic areas...</div>
      </div>
      <button class="btn btn-primary" onclick="addStrategicArea()">
        <i class="fas fa-plus"></i> Add New Strategic Area
      </button>
    </div>

    <!-- Strategy Development Section -->
    <div id="strategy-development" class="content-section">
      <h2>Strategy Development Management</h2>
      <div class="content-grid" id="strategyDevelopmentGrid">
        <div class="loading">Loading strategy development items...</div>
      </div>
      <button class="btn btn-primary" onclick="addStrategyDevelopment()">
        <i class="fas fa-plus"></i> Add New Strategy Development Item
      </button>
    </div>

    <!-- Partnerships Section -->
    <div id="partnerships" class="content-section">
      <h2>Partnerships Management</h2>
      <div class="content-grid" id="partnershipsGrid">
        <div class="loading">Loading partnerships...</div>
      </div>
      <button class="btn btn-primary" onclick="addPartnership()">
        <i class="fas fa-plus"></i> Add New Partnership
      </button>
    </div>

    <!-- Site Settings Section -->
    <div id="site-settings" class="content-section">
      <h2>Site Settings</h2>
      <form id="siteSettingsForm">
        <div class="form-row">
          <div class="form-group">
            <label for="siteTitle">Site Title</label>
            <input type="text" id="siteTitle" name="siteTitle" placeholder="Enter site title">
          </div>
          <div class="form-group">
            <label for="siteDescription">Site Description</label>
            <textarea id="siteDescription" name="siteDescription" placeholder="Enter site description"></textarea>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="contactPhone">Contact Phone</label>
            <input type="text" id="contactPhone" name="contactPhone" placeholder="Enter contact phone">
          </div>
          <div class="form-group">
            <label for="contactEmail">Contact Email</label>
            <input type="email" id="contactEmail" name="contactEmail" placeholder="Enter contact email">
          </div>
        </div>

        <div class="form-group">
          <label for="contactAddress">Contact Address</label>
          <input type="text" id="contactAddress" name="contactAddress" placeholder="Enter contact address">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="facebookUrl">Facebook URL</label>
            <input type="url" id="facebookUrl" name="facebookUrl" placeholder="Enter Facebook URL">
          </div>
          <div class="form-group">
            <label for="twitterUrl">Twitter URL</label>
            <input type="url" id="twitterUrl" name="twitterUrl" placeholder="Enter Twitter URL">
          </div>
        </div>

        <div class="form-group">
          <label for="linkedinUrl">LinkedIn URL</label>
          <input type="url" id="linkedinUrl" name="linkedinUrl" placeholder="Enter LinkedIn URL">
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="resetForm('siteSettingsForm')">Reset</button>
          <button type="submit" class="btn btn-primary">Save Settings</button>
        </div>
      </form>
    </div>

    <!-- User Management Section -->
    <div id="users" class="content-section">
      <h2>User Management</h2>
      <div class="content-grid" id="usersGrid">
        <div class="loading">Loading users...</div>
      </div>
      <button class="btn btn-primary" onclick="addUser()">
        <i class="fas fa-plus"></i> Add New User
      </button>
    </div>
  </div>

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <script>
    // Global variables
    const API_BASE_URL = window.location.origin + '/api';
    let authToken = null;
    let currentUser = null;

    // Initialize the dashboard
    document.addEventListener('DOMContentLoaded', async function() {
      // Check authentication
      const isAuthenticated = await checkAuth();
      if (!isAuthenticated) {
        window.location.href = 'admin.html';
        return;
      }

      // Load initial data
      await loadHomepageData();
      await loadStrategicAreas();
      await loadStrategyDevelopment();
      await loadPartnerships();
      await loadSiteSettings();
      await loadUsers();

      // Set up form event listeners
      setupFormListeners();
    });

    // Authentication functions
    async function checkAuth() {
      const token = localStorage.getItem('authToken');
      if (!token) {
        return false;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/verify`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (response.ok) {
          const data = await response.json();
          currentUser = data.user;
          document.getElementById('userInfo').textContent = `Welcome, ${currentUser.username}`;
          authToken = token;
          return true;
        } else {
          localStorage.removeItem('authToken');
          return false;
        }
      } catch (error) {
        console.error('Auth check failed:', error);
        return false;
      }
    }

    // Logout function
    async function logout() {
      try {
        if (authToken) {
          await fetch(`${API_BASE_URL}/logout`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${authToken}`
            }
          });
        }
      } catch (error) {
        console.error('Logout error:', error);
      } finally {
        localStorage.removeItem('authToken');
        window.location.href = 'admin.html';
      }
    }

    // Navigation functions
    function showSection(sectionId) {
      // Hide all sections
      document.querySelectorAll('.content-section').forEach(section => {
        section.classList.remove('active');
      });

      // Remove active class from all tabs
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.classList.remove('active');
      });

      // Show selected section
      document.getElementById(sectionId).classList.add('active');

      // Add active class to clicked tab
      event.target.classList.add('active');
    }

    // Message display functions
    function showMessage(message, type = 'info') {
      const container = document.getElementById('messageContainer');
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${type}`;
      messageDiv.textContent = message;
      
      container.innerHTML = '';
      container.appendChild(messageDiv);
      
      setTimeout(() => {
        messageDiv.remove();
      }, 5000);
    }

    // Form utility functions
    function resetForm(formId) {
      document.getElementById(formId).reset();
      // Clear image previews
      document.querySelectorAll('.image-preview').forEach(img => {
        img.style.display = 'none';
        img.src = '';
      });
    }

    function previewImage(input, previewId) {
      const preview = document.getElementById(previewId);
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          preview.src = e.target.result;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    // Data loading functions
    async function loadHomepageData() {
      // This would load from your CMS content files
      // For now, we'll use placeholder data
      console.log('Loading homepage data...');
    }

    async function loadStrategicAreas() {
      const grid = document.getElementById('strategicAreasGrid');
      grid.innerHTML = '<div class="loading">Loading strategic areas...</div>';
      
      // Simulate loading data
      setTimeout(() => {
        grid.innerHTML = `
          <div class="content-card">
            <h3>Baseline & End line Surveys</h3>
            <p>Comprehensive data collection and analysis</p>
            <div class="actions">
              <button class="btn btn-primary" onclick="editStrategicArea(1)">Edit</button>
              <button class="btn btn-danger" onclick="deleteStrategicArea(1)">Delete</button>
            </div>
          </div>
          <div class="content-card">
            <h3>Policy Analysis Development & Reviews</h3>
            <p>Expert policy analysis and development</p>
            <div class="actions">
              <button class="btn btn-primary" onclick="editStrategicArea(2)">Edit</button>
              <button class="btn btn-danger" onclick="deleteStrategicArea(2)">Delete</button>
            </div>
          </div>
        `;
      }, 1000);
    }

    async function loadStrategyDevelopment() {
      const grid = document.getElementById('strategyDevelopmentGrid');
      grid.innerHTML = '<div class="loading">Loading strategy development items...</div>';
      
      // Simulate loading data
      setTimeout(() => {
        grid.innerHTML = `
          <div class="content-card">
            <h3>OCA's</h3>
            <p>Organizational Capacity Assessments</p>
            <div class="actions">
              <button class="btn btn-primary" onclick="editStrategyDevelopment(1)">Edit</button>
              <button class="btn btn-danger" onclick="deleteStrategyDevelopment(1)">Delete</button>
            </div>
          </div>
          <div class="content-card">
            <h3>Strategic Plans</h3>
            <p>Comprehensive strategic planning</p>
            <div class="actions">
              <button class="btn btn-primary" onclick="editStrategyDevelopment(2)">Edit</button>
              <button class="btn btn-danger" onclick="deleteStrategyDevelopment(2)">Delete</button>
            </div>
          </div>
        `;
      }, 1000);
    }

    async function loadPartnerships() {
      const grid = document.getElementById('partnershipsGrid');
      grid.innerHTML = '<div class="loading">Loading partnerships...</div>';
      
      // Simulate loading data
      setTimeout(() => {
        grid.innerHTML = `
          <div class="content-card">
            <h3>Producer Organizations</h3>
            <p>Count: 5</p>
            <div class="actions">
              <button class="btn btn-primary" onclick="editPartnership(1)">Edit</button>
              <button class="btn btn-danger" onclick="deletePartnership(1)">Delete</button>
            </div>
          </div>
          <div class="content-card">
            <h3>Input Providers</h3>
            <p>Count: 15</p>
            <div class="actions">
              <button class="btn btn-primary" onclick="editPartnership(2)">Edit</button>
              <button class="btn btn-danger" onclick="deletePartnership(2)">Delete</button>
            </div>
          </div>
        `;
      }, 1000);
    }

    async function loadSiteSettings() {
      // Load site settings from CMS
      console.log('Loading site settings...');
    }

    async function loadUsers() {
      const grid = document.getElementById('usersGrid');
      grid.innerHTML = '<div class="loading">Loading users...</div>';
      
      try {
        const response = await fetch(`${API_BASE_URL}/users`, {
          headers: {
            'Authorization': `Bearer ${authToken}`
          }
        });

        if (response.ok) {
          const data = await response.json();
          const users = data.users;
          
          grid.innerHTML = users.map(user => `
            <div class="content-card">
              <h3>${user.username}</h3>
              <p><strong>Email:</strong> ${user.email}</p>
              <p><strong>Role:</strong> ${user.role}</p>
              <p><strong>Status:</strong> ${user.is_active ? 'Active' : 'Inactive'}</p>
              <p><strong>Last Login:</strong> ${user.last_login ? new Date(user.last_login).toLocaleDateString() : 'Never'}</p>
              <div class="actions">
                <button class="btn btn-primary" onclick="editUser(${user.id})">Edit</button>
                <button class="btn btn-danger" onclick="deleteUser(${user.id})">Delete</button>
              </div>
            </div>
          `).join('');
        } else {
          grid.innerHTML = '<div class="message error">Failed to load users</div>';
        }
      } catch (error) {
        console.error('Error loading users:', error);
        grid.innerHTML = '<div class="message error">Error loading users</div>';
      }
    }

    // Form setup
    function setupFormListeners() {
      // Homepage form
      document.getElementById('homepageForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const data = Object.fromEntries(formData);
        
        // Here you would save the data to your CMS
        console.log('Saving homepage data:', data);
        showMessage('Homepage content saved successfully!', 'success');
      });

      // Site settings form
      document.getElementById('siteSettingsForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const data = Object.fromEntries(formData);
        
        // Here you would save the data to your CMS
        console.log('Saving site settings:', data);
        showMessage('Site settings saved successfully!', 'success');
      });
    }

    // Action functions (placeholders for now)
    function addStrategicArea() {
      showMessage('Add strategic area functionality coming soon!', 'info');
    }

    function editStrategicArea(id) {
      showMessage(`Edit strategic area ${id} functionality coming soon!`, 'info');
    }

    function deleteStrategicArea(id) {
      if (confirm('Are you sure you want to delete this strategic area?')) {
        showMessage(`Strategic area ${id} deleted!`, 'success');
      }
